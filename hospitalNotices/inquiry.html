<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>限高价复核情况表</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body        { padding: 2rem; max-width: 960px; margin:auto; }
    #exportArea { background:#f8f9fa; padding:1.5rem; margin-top:2rem; }

    /* Word 导出需要的黑框表样式（备用） */
    .word-table           { border-collapse:collapse; width:100%; }
    .word-table th,
    .word-table td        { border:1px solid #000; padding:6px; text-align:center; }
  </style>
</head>

<body>
  <h1 class="mb-4">限高价复核情况表</h1>

  <!-- ====== 1. 输入表单 ====== -->
  <form id="dataForm" class="vstack gap-3">

    <div class="row g-3">
      <div class="col-sm-3">
        <label for="hospital" class="form-label">申购院区</label>
        <select id="hospital" name="hospital" class="form-select" required>
          <option value="" disabled selected>请选择院区</option>
          <option value="昆州">昆州</option>
          <option value="自贸">自贸</option>
        </select>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm-3"><label class="form-label">货物名称</label><input name="goodsName" class="form-control" required></div>
    </div>

    <div class="row g-3">
      <div class="col-sm-2"><label class="form-label">采购数量</label><input name="purchaseQuantity" type="number" class="form-control" required></div>
    </div>

    <div class="row g-3">
      <div class="col-sm-2"><label class="form-label">一、技术/需求参数</label><input name="技术需求参数" type="number" class="form-control" required></div>
    </div>

    <div class="row g-3">
      <div class="col-sm-2"><label class="form-label">供货时间（日）</label><input name="deliveryDays" type="number" class="form-control" required></div>
    </div>

    <div class="row g-3">
      <div class="col-sm-2"><label class="form-label">质保期（年）</label><input name="warrantyPeriod" type="number" class="form-control" required></div>
    </div>

    <div class="row g-3">
      <div class="col-sm-2"><label class="form-label">巡检周期（月/次）</label><input name="inspectionCycle" type="number" class="form-control" required></div>
    </div>



    <!-- 操作按钮 -->
    <div class="d-flex gap-3 mt-4">
      <button type="button" id="btnPreview"  class="btn btn-primary flex-grow-1">预览</button>
      <button type="button" id="btnDownload" class="btn btn-success flex-grow-1" disabled>下载 Word</button>
    </div>
  </form>

  <!-- ====== 2. 预览区域 ====== -->
  <div id="exportArea" class="d-none"></div>

  <!-- ====== 依赖库 ====== -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js-version-updated@0.4.0/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
    /* -------------------- 数据收集 & 校验 -------------------- */
    function collectData () {
      const form = document.getElementById('dataForm');
      if (!form.reportValidity()) return null;        // 原生必填校验

      const obj = Object.fromEntries(new FormData(form));
      obj.unit_price  = parseFloat(obj.unit_price);
      obj.quantity    = parseFloat(obj.quantity);
      obj.total_price = (obj.unit_price * obj.quantity).toFixed(2);

      return obj;
    }

    /* -------------------- 构造 HTML -------------------- */
    function buildHTML (d) {

      return `
        <h2 style="text-align:center;">北京大学肿瘤医院云南医院 云南省肿瘤医院 昆明医科大学第三附属医院${d.goodsName}项目询价</h2>
        <h1 style="text-align:center;">采购公告</h1>
        
        <p>本项目拟采用询价采购方式进行采购，凡有意参与的供应商请按照本公告要求在规定时间内递交应答文件。</p>
        <p>货物名称：${d.goodsName}</p>
        <p>采购单位：北京大学肿瘤医院云南医院 云南省肿瘤医院 昆明医科大学第三附属医院</p>
        <p>采购数量：${d.purchaseQuantity}</p>

        <h3>一、技术/需求参数</h3>

        <p>二、供货时间</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;自确定为供应商后${d.deliveryDays}日内到货</p>
        <p>三、*供货地点</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;北京大学肿瘤医院云南医院 云南省肿瘤医院 昆明医科大学第三附属医院指定地点</p>
        <p>四、*验收标准</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;符合国家或行业内标准</p>
        <p>五、*售后服务</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;质保期≥${d.warrantyPeriod}年，巡检周期${d.inspectionCycle}月/次</p>
        <p>六、其他</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;说明：“*”条款为必须满足条款，供应商如提供应答文件视为“*”条款完全响应。</p>
        <p>七.※供应商资格条件：</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;1. 供应商应为在中华人民共和国境内合法注册能够独立承担民事责任的法人、其他组织或者自然人。</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;2. 具有良好的商业信誉和健全的财务会计制度；具有履行合同所必需的设备和专业技术能力。</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;3. 具备与货物匹配的医疗器械经营备案资质。（如需）</p>
        <p>递交文件清单：详见附件</p>
        <p>递交邮箱：ZLYYZCB@163.com</p>
        <p>递交文件截止时间：发布之日起3个工作日内，下午6:00（北京时间）截止，逾期递交的文件为无效文件，恕不接受。</p>
        <p>联系人：张老师  联系电话：0871-68173651</p>
        <p>地点：昆州路519号后勤楼407办公室</p>
        <p></p>
        <p></p>
      `;
    }

    /* -------------------- 预览按钮 -------------------- */
    let lastHtml = ''; // 记录最近一次预览结果

    document.getElementById('btnPreview').addEventListener('click', () => {
      const data = collectData();
      if (!data) return;

      lastHtml = buildHTML(data);
      const exportArea = document.getElementById('exportArea');
      exportArea.innerHTML = lastHtml;
      exportArea.classList.remove('d-none');
      document.getElementById('btnDownload').disabled = false;
    });

    /* 表单一有变动立即禁用下载，避免导出旧内容 */
    document.getElementById('dataForm').addEventListener('input', () => {
      document.getElementById('btnDownload').disabled = true;
    });

    /* -------------------- 下载按钮 -------------------- */
    document.getElementById('btnDownload').addEventListener('click', () => {
      if (!lastHtml) return;

      const fullHtml = `
        <!DOCTYPE html>
        <html><head><meta charset="utf-8">
          <style>${document.querySelector('style').textContent}</style>
        </head><body>${lastHtml}</body></html>
      `;

      const blob = window.htmlDocx.asBlob(fullHtml);
      saveAs(blob, '限高价复核情况表.docx');
    });
  </script>
</body>
</html>
