<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>在线生成 Word（离线版）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { padding: 2rem; max-width: 650px; margin: auto; }
    footer { margin-top: 3rem; font-size: .875rem; color: #666; }
  </style>
</head>

<body>
  <h1 class="mb-4">填写信息并导出 Word</h1>

  <form id="docForm" class="vstack gap-3">
    <!-- 模板上传 -->
    <div>
      <label class="form-label">选择 Word 模板 (.docx)</label>
      <input type="file" id="tpl" accept=".docx" class="form-control" required>
    </div>

    <!-- 自定义字段示例 -->
    <div>
      <label class="form-label">姓名</label>
      <input name="name" class="form-control" required>
    </div>

    <div>
      <label class="form-label">日期</label>
      <input type="date" name="date" class="form-control" required>
    </div>

    <button class="btn btn-primary w-100">生成 Word</button>
  </form>

  <footer>
    <p>✨ 小贴士：Word 模板中用 <code>{name}</code>、<code>{date}</code> 等花括号占位符；支持循环、条件、图片等高级语法，详见 <a href="https://docxtemplater.com/" target="_blank">Docxtemplater</a> 官方文档。</p>
  </footer>

  <!-- 依赖库：PizZip + Docxtemplater + FileSaver -->
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.65.1/build/docxtemplater.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
    document.getElementById('docForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // ① 读取用户上传的模板
      const tplFile = document.getElementById('tpl').files[0];
      if (!tplFile) { return alert('请先选择 Word 模板！'); }
      const arrayBuffer = await tplFile.arrayBuffer();

      // ② 收集表单字段
      const data = Object.fromEntries(new FormData(e.target));   // { name: "...", date: "..." }

      try {
        // ③ 渲染
        const zip = new PizZip(arrayBuffer);
        const doc = new window.docxtemplater(zip, {
          paragraphLoop: true,
          linebreaks: true
        });
        doc.render(data);

        // ④ 导出
        const blob = doc.getZip().generate({
          type: 'blob',
          mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        });
        saveAs(blob, '填报结果.docx');
      } catch (err) {
        console.error(err);
        alert('生成失败：' + err.message);
      }
    });
  </script>
</body>
</html>
