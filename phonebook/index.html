<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医院通讯录</title>
  <style>
    :root {
      --blue: #2563eb;
      --purple: #7c3aed;
      --green: #16a34a;
      --gray: #374151;
      --red: #dc2626;
      --bg: #f6f8fb;
      --card: #fff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: white;
      padding: 34px 18px 42px;
    }

    .hero {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -0.04em;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      line-height: 1.8;
      max-width: 900px;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: -26px auto 60px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input,
    select,
    button {
      font: inherit;
      border-radius: 12px;
    }

    input,
    select {
      border: 1px solid var(--border);
      padding: 11px 12px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    #searchInput {
      flex: 1 1 320px;
      min-width: 220px;
    }

    button {
      border: 0;
      padding: 11px 14px;
      color: white;
      background: #111827;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-blue {
      background: var(--blue);
    }

    .btn-green {
      background: var(--green);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    @media (max-width: 820px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .stat {
      color: white;
      border-radius: 14px;
      padding: 14px;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat strong {
      font-size: 28px;
    }

    .stat span {
      font-size: 13px;
      opacity: 0.9;
    }

    .行政 { background: var(--blue); }
    .后勤 { background: var(--purple); }
    .门诊 { background: var(--green); }
    .医技 { background: var(--gray); }
    .临床 { background: var(--red); }

    .count {
      color: var(--muted);
      margin-top: 12px;
      font-size: 14px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 11px 10px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: #374151;
      font-weight: 800;
      white-space: nowrap;
    }

    tr:hover td {
      background: #f9fafb;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tel {
      color: var(--green);
      font-weight: 800;
      text-decoration: none;
    }

    .copy {
      padding: 7px 10px;
      font-size: 13px;
      background: #0f172a;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 36px 12px;
    }

    footer {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <section class="hero">
      <h1>医院通讯录</h1>
      <p>内线号码可直接互打；如需拨打外线电话，请按院内规则在号码前加拨 “9”，外省号码前加拨“90”。支持按分类、电话、短号、科室、位置快速搜索。</p>
    </section>
  </header>

  <main>
    <section class="card">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="搜索：电话 / 短号 / 科室 / 位置，例如：急诊、2669、门诊楼 1 楼" />
        <select id="categoryFilter">
          <option value="">全部分类</option>
        </select>
        <select id="locationFilter">
          <option value="">全部位置</option>
        </select>
        <button class="btn-green" id="exportCsvBtn">导出 CSV</button>
        <button class="btn-blue" id="resetBtn">重置筛选</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="count" id="countText"></div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>分类</th>
              <th>电话</th>
              <th>短号</th>
              <th>科室 / 名称</th>
              <th>位置</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="contactBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="card">
      2025年5月26日止，后勤保障部编印，2025年版。建议人工复核电话、短号和位置。
    </footer>
  </main>

  <script>
    const rawData = document.getElementById("contact-data").textContent.trim();

    const contacts = rawData
      .split("\n")
      .slice(1)
      .map((line, index) => {
        const [category, phone, ext, name, location] = line.split("|");
        return {
          id: index + 1,
          category: category?.trim() || "",
          phone: phone?.trim() || "",
          ext: ext?.trim() || "",
          name: name?.trim() || "",
          location: location?.trim() || ""
        };
      });

    const categoryOrder = ["行政", "后勤", "门诊", "医技", "临床"];

    const elements = {
      searchInput: document.getElementById("searchInput"),
      categoryFilter: document.getElementById("categoryFilter"),
      locationFilter: document.getElementById("locationFilter"),
      contactBody: document.getElementById("contactBody"),
      countText: document.getElementById("countText"),
      stats: document.getElementById("stats"),
      exportCsvBtn: document.getElementById("exportCsvBtn"),
      resetBtn: document.getElementById("resetBtn")
    };

    init();

    function init() {
      renderCategoryOptions();
      renderLocationOptions();
      renderStats();
      renderTable();

      elements.searchInput.addEventListener("input", renderTable);
      elements.categoryFilter.addEventListener("change", renderTable);
      elements.locationFilter.addEventListener("change", renderTable);
      elements.exportCsvBtn.addEventListener("click", exportCsv);
      elements.resetBtn.addEventListener("click", resetFilters);

      elements.contactBody.addEventListener("click", async event => {
        const button = event.target.closest("[data-copy]");
        if (!button) return;

        const text = button.dataset.copy;
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "已复制";
          setTimeout(() => (button.textContent = "复制"), 900);
        } catch {
          alert("复制失败，请手动复制：" + text);
        }
      });
    }

    function renderCategoryOptions() {
      const categories = [...new Set(contacts.map(item => item.category))]
        .filter(Boolean)
        .sort((a, b) => categoryOrder.indexOf(a) - categoryOrder.indexOf(b));

      elements.categoryFilter.innerHTML =
        `<option value="">全部分类</option>` +
        categories.map(item => `<option value="${escapeAttr(item)}">${escapeHtml(item)}</option>`).join("");
    }

    function renderLocationOptions() {
      const locations = [...new Set(contacts.map(item => item.location))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, "zh-CN"));

      elements.locationFilter.innerHTML =
        `<option value="">全部位置</option>` +
        locations.map(item => `<option value="${escapeAttr(item)}">${escapeHtml(item)}</option>`).join("");
    }

    function renderStats() {
      const counts = Object.fromEntries(categoryOrder.map(item => [item, 0]));

      for (const contact of contacts) {
        if (counts[contact.category] !== undefined) {
          counts[contact.category]++;
        }
      }

      elements.stats.innerHTML = categoryOrder.map(category => `
        <div class="stat ${escapeAttr(category)}">
          <span>${escapeHtml(category)}</span>
          <strong>${counts[category]}</strong>
        </div>
      `).join("");
    }

    function getFilteredContacts() {
      const keyword = elements.searchInput.value.trim().toLowerCase();
      const category = elements.categoryFilter.value;
      const location = elements.locationFilter.value;

      return contacts.filter(contact => {
        const text = [
          contact.category,
          contact.phone,
          contact.ext,
          contact.name,
          contact.location
        ].join(" ").toLowerCase();

        return (!keyword || text.includes(keyword)) &&
          (!category || contact.category === category) &&
          (!location || contact.location === location);
      });
    }

    function renderTable() {
      const rows = getFilteredContacts();

      elements.countText.textContent = `共 ${contacts.length} 条，当前显示 ${rows.length} 条`;

      if (!rows.length) {
        elements.contactBody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty">没有找到匹配的通讯录记录。</div>
            </td>
          </tr>
        `;
        return;
      }

      elements.contactBody.innerHTML = rows.map(contact => {
        const phoneLink = contact.phone
          ? `<a class="tel" href="tel:${escapeAttr(contact.phone)}">${escapeHtml(contact.phone)}</a>`
          : `<span style="color:#9ca3af;">—</span>`;

        const extLink = contact.ext && contact.ext !== "—"
          ? `<a class="tel" href="tel:${escapeAttr(contact.ext)}">${escapeHtml(contact.ext)}</a>`
          : escapeHtml(contact.ext || "—");

        const copyText = [contact.phone, contact.ext, contact.name, contact.location]
          .filter(Boolean)
          .join(" ");

        return `
          <tr>
            <td><span class="pill ${escapeAttr(contact.category)}">${escapeHtml(contact.category)}</span></td>
            <td>${phoneLink}</td>
            <td>${extLink}</td>
            <td>${highlight(contact.name)}</td>
            <td>${highlight(contact.location || "—")}</td>
            <td>
              <button class="copy" data-copy="${escapeAttr(copyText)}">复制</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function highlight(value) {
      const keyword = elements.searchInput.value.trim();
      const safeValue = escapeHtml(value);

      if (!keyword) return safeValue;

      const escapedKeyword = escapeRegExp(keyword);
      const reg = new RegExp(`(${escapedKeyword})`, "gi");

      return safeValue.replace(reg, `<mark>$1</mark>`);
    }

    function resetFilters() {
      elements.searchInput.value = "";
      elements.categoryFilter.value = "";
      elements.locationFilter.value = "";
      renderTable();
    }

    function exportCsv() {
      const headers = ["分类", "电话", "短号", "科室/名称", "位置"];
      const rows = contacts.map(item => [
        item.category,
        item.phone,
        item.ext,
        item.name,
        item.location
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(csvCell).join(","))
        .join("\n");

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "医院通讯录.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value ?? "").replace(/"/g, '""')}"`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
  </script>
