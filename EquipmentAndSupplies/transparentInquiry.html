<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>限高价复核情况表</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body          { padding: 2rem; max-width: 960px; margin:auto; }
    #exportArea   { background:#f8f9fa; padding:1.5rem; margin-top:2rem; }
    .word-table   { border-collapse:collapse; width:100%; }
    .word-table th,
    .word-table td{ border:1px solid #000; padding:6px; text-align:center; }


  </style>
</head>
<body>
  <h1 class="mb-4">限高价复核情况表</h1>

  <!-- ====== 1. 输入表单 ====== -->
  <form id="dataForm" class="vstack gap-3">


    <div class="row g-3">
      <div class="col-sm-3">
        <label for="centralizedManagementDepartment" class="form-label">归口管理部门</label>
        <select id="centralizedManagementDepartment" name="centralizedManagementDepartment" class="form-select" required>
          <option value="" disabled selected>请选择归口管理部门</option>
          <option value="资产管理部">资产管理部</option>
          <option value="信息中心">信息中心</option>
          <option value="后勤保障部">后勤保障部</option>
          <option value="党委宣传部">党委宣传部</option>
          <option value="院务部">院务部</option>
          <option value="肿瘤防治办公室">肿瘤防治办公室</option>
          <option value="医学教育部">医学教育部</option>
          <option value="工会">工会</option>
          <option value="安全保卫部">安全保卫部</option>
          <option value="护理部">护理部</option>
          <option value="医务部">医务部</option>
          <option value="离退休办公室">离退休办公室</option>
          <option value="科研部">科研部</option>
          <option value=""></option>
        </select>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm-3">
        <label class="form-label">需求书申购流水号</label>
        <input name="serialNumber" class="form-control" required>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm-3">
        <label for="hospital" class="form-label">申购院区</label>
        <select id="hospital" name="hospital" class="form-select" required>
          <option value="" disabled selected>请选择院区</option>
          <option value="昆州院区">昆州院区</option>
          <option value="自贸院区">自贸院区</option>
          <option value="昆州与自贸院区">昆州与自贸院区</option>
        </select>
      </div>
    </div>

    

    <div class="row g-3">
      <div class="col-sm-3">
        <label class="form-label">申购科室</label>
        <input name="department" class="form-control" required>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-sm-3">
        <label class="form-label">采购项目</label>
        <input name="procurementItem" class="form-control" required>
      </div>
      <div class="col-sm-2">
        <label class="form-label">单价(万元)</label>
        <input name="unit_price" type="number" step="any" class="form-control" required>
      </div>
      <div class="col-sm-2">
        <label class="form-label">数量(单位)</label>
        <input name="quantity" type="number" class="form-control" required>
      </div>
      <div class="col-sm-2">
        <label class="form-label">单位</label>
        <input name="subject_unit" class="form-control" required>
      </div>
      <!-- 
      <div class="col-sm-2">
        <label class="form-label">质保期（年）</label>
        <input name="warrantyPeriod" type="number" class="form-control" required>
      </div> 
      -->
    </div>


    <!-- 动态表格 -->
    <div class="mt-3">
      <label class="form-label d-block">信息来源明细</label>
      <table class="table table-bordered align-middle" id="itemsTable">
        <thead class="table-light text-center">
          <tr>
            <th style="width:18%">信息来源渠道</th>
            <th style="width:16%">采购单位</th>
            <th style="width:16%">采购时间</th>
            <th style="width:16%">采购单价(万元)</th>
            <th style="width:16%">设备型号</th>
            <th style="width:16%">备注</th>
            <th style="width:2%"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button type="button" id="btnAdd" class="btn btn-sm btn-secondary">➕ 新增一行</button>
    </div>


    <div class="row g-3">
      <div class="col-sm-2">
        <label class="form-label">复核人</label>
        <input name="reviewer" class="form-control" required>
      </div>
    </div>


    <div class="row g-3">
      <div class="col-sm-3">
        <label class="form-label">复核日期</label>
        <input name="date" type="date" class="form-control" required>
      </div>
    </div>



    <!-- 操作按钮 -->
    <div class="d-flex gap-3 mt-4">
      <button type="button" id="btnPreview"  class="btn btn-primary flex-grow-1">预览</button>
      <button type="button" id="btnDownload" class="btn btn-success flex-grow-1" disabled>下载 Word</button>
    </div>
  </form>

  <!-- ====== 2. 预览区域 ====== -->
  <div id="exportArea" class="d-none"></div>

  <!-- ====== 依赖库 ====== -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js-version-updated@0.4.0/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
    /* ===== 公共工具 ===== */
    // const stripNumber = v => (isNaN(v) || v === '' ? v : Number(v).toString());
    const numStr = v => {
      if (v === '' || v == null || isNaN(v)) return v;      // 保留非数字 / 空值
      // 用字符串算出“整数部分 + 小数部分（如有）”
      const s = String(v);
      if (!s.includes('.')) return s;                       // 整数直接返回
      return s.replace(/(\.\d*?[1-9])0+$|\.0+$/, '$1');     // 去掉尾部 0
    };
    const formatDate  = iso => {
      const [y,m,d] = iso.split('-');
      return `${y}年${Number(m)}月${Number(d)}日`;
    };

    /* ===== 动态增删行 ===== */
    const tbody = document.querySelector('#itemsTable tbody');
    document.getElementById('btnAdd').onclick = () => addRow();
    addRow();                                // 默认一行

    function addRow(data = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="form-control" required value="${data.info_source || ''}"></td>
        <td><input class="form-control" required value="${data.purchase_dept || ''}"></td>
        <td><input type="month" class="form-control" required value="${data.purchase_date || ''}"></td>
        <td><input type="number" step="any" class="form-control" required value="${data.purchase_price || ''}"></td>
        <td><input class="form-control" required value="${data.model || ''}"></td>
        <td><input class="form-control" value="${data.notes || ''}"></td>
        <td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger">✖</button></td>`;
      tr.querySelector('button').onclick = () => tr.remove();
      tbody.appendChild(tr);
    }

    /* ===== 数据收集与校验 ===== */
    function collectData() {
      const form = document.getElementById('dataForm');
      const fd = new FormData(form);
      const obj = Object.fromEntries(fd);

      const requiredFields = {
        'centralizedManagementDepartment': '归口管理部门',
        'serialNumber': '需求书申购流水号',
        'hospital': '申购院区',
        'department': '申购科室',
        'procurementItem': '采购项目',
        'unit_price': '单价',
        'quantity': '数量',
        'subject_unit': '单位',
        'reviewer': '复核人',
        'date': '复核日期'
      };

      let hasMissing = false;
      for (const [key] of Object.entries(requiredFields)) {
        const input = form.querySelector(`[name="${key}"]`);
        const value = obj[key]?.trim();
        if (!value) {
          input.classList.add('is-invalid');
          hasMissing = true;
        } else {
          input.classList.remove('is-invalid');
        }
      }

      // if (hasMissing) return null;

      // 表格校验
      const items = [];
      let tableError = false;
      const rows = [...tbody.querySelectorAll('tr')];
      const requiredCols = [0, 1, 2, 3, 4];

      rows.forEach((tr, rowIndex) => {
        const tds = tr.querySelectorAll('td');
        const getVal = i => tds[i]?.querySelector('input')?.value.trim() || '';
        const getEl  = i => tds[i]?.querySelector('input');

        const values = requiredCols.map(getVal);
        const inputs = requiredCols.map(getEl);
        const allEmpty = values.every(v => v === '');
        const someEmpty = values.some(v => v === '');

        // 清除旧样式
        inputs.forEach(el => el?.classList.remove('is-invalid'));

        // 处理错误情况
        if (someEmpty && !allEmpty) {
          inputs.forEach((el, i) => {
            if (!values[i]) el.classList.add('is-invalid');
          });
          tableError = true;
          return;
        }

        if (allEmpty) {
          // 如果所有行中只有这一行，且它是空的 => 必须填，否则不能提交
          if (rows.length === 1) {
            inputs.forEach(el => el?.classList.add('is-invalid'));
            tableError = true;
          }
          return; // 忽略空行
        }

        // 有效行
        items.push({
          info_source: getVal(0),
          purchase_dept: getVal(1),
          purchase_date: getVal(2),
          purchase_price: getVal(3),
          model: getVal(4),
          notes: getVal(5),
        });
      });

      // if (tableError || items.length === 0) return null;
      if (hasMissing || tableError || items.length === 0) return null;

      const totalRaw = Number(obj.unit_price) * Number(obj.quantity || 0);
      obj.total_price     = numStr(totalRaw);
      obj.items           = items;
      obj.unit_price_show = numStr(obj.unit_price);
      obj.date_show       = formatDate(obj.date);

      return obj;
    }


    /* ===== 构造导出 HTML ===== */
    function buildHTML(d) {
      const hasNotes = d.items.some(r => r.notes && r.notes.trim() !== '');

      const headerCells = `
        <th>信息来源渠道</th>
        <th>采购单位</th>
        <th>采购时间</th>
        <th>采购单价</th>
        <th>设备型号</th>
        ${hasNotes ? '<th>备注</th>' : ''}
      `;

      const rows = d.items.map(r => `
        <tr>
          <td>${r.info_source}</td>
          <td>${r.purchase_dept}</td>
          <td>${r.purchase_date}</td>
          <td>${numStr(r.purchase_price)}</td>
          <td>${r.model}</td>
          ${hasNotes ? `<td>${r.notes || ''}</td>` : ''}
        </tr>
      `).join('');

      return `
        <h2 style="text-align:center;">限高价复核情况表</h2>
        <p>一、需求书申购流水号：${d.serialNumber}</p>
        <p>二、申购院区：${d.hospital}</p>
        <p>三、申购科室：${d.department}</p>
        <p>四、采购项目：${d.procurementItem}</p>
        <p>${d.centralizedManagementDepartment}建议最高限价：${d.unit_price_show} 万元/${d.subject_unit}，${d.quantity}${d.subject_unit}，共计：${d.total_price} 万元</p>
        <p>五、招标采购办公室复核情况：</p>

        <table class="word-table">
          <thead><tr>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>

        <p style="margin-top:1rem;">招标采购办公室意见：经调研该项目市场成交价对比使用部门及${d.centralizedManagementDepartment}价格调研情况，建议以${d.centralizedManagementDepartment}调研结果采购。</p>
        <p style="margin-top:1.5rem;">复核人：${d.reviewer}</p>
        <p>时间：${d.date_show}</p>
      `;
    }


    /* ===== 预览 ===== */
    let lastHtml = '';
    document.getElementById('btnPreview').onclick = () => {
      const data = collectData();
      if (!data) return;

      lastHtml = buildHTML(data);
      const exportArea = document.getElementById('exportArea');
      exportArea.innerHTML = lastHtml;
      exportArea.classList.remove('d-none');
      document.getElementById('btnDownload').disabled = false;
    };

    /* 表单改动 ⇒ 禁用下载 */
    document.getElementById('dataForm').addEventListener('input', () => {
      document.getElementById('btnDownload').disabled = true;
    });

    /* ===== 下载 Word ===== */
    document.getElementById('btnDownload').onclick = () => {
      if (!lastHtml) return;
      const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${
        document.querySelector('style').innerHTML
      }</style></head><body>${lastHtml}</body></html>`;

      const blob = window.htmlDocx.asBlob(fullHtml);
      saveAs(blob, '限高价复核情况表.docx');
    };

    // 必填的填完后，自动清除标红框
    document.querySelectorAll('#dataForm input, #dataForm select').forEach(el => {
      el.addEventListener('input', () => el.classList.remove('is-invalid'));
    });
    tbody.addEventListener('input', e => {
      if (e.target.tagName === 'INPUT') {
        e.target.classList.remove('is-invalid');
      }
    });

  </script>
</body>
</html>
