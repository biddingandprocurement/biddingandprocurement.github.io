<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>议题：限高价复核</title>
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> -->
  <!-- <link rel="stylesheet" href="https://raw.githubusercontent.com/biddingandprocurement/resources/main/style/bootstrap.min.css"> -->
  <link rel="stylesheet" href="./bootstrap.min.css">
  <style>
    body          { padding: 2rem; max-width: 960px; margin:auto; }
    #exportArea   { background:#f8f9fa; padding:1.5rem; margin-top:2rem; }
    .word-table   { border-collapse:collapse; width:100%; }
    .word-table th,
    .word-table td{ border:1px solid #000; padding:6px; text-align:center; }


  </style>
</head>
<body>
  <h1 class="mb-4">议题：限高价复核</h1>

  <!-- ====== 1. 输入表单 ====== -->
  <form id="dataForm" class="vstack gap-3">


    <div class="row g-3">
      <div class="col-sm-3">
        <label for="centralizedManagementDepartment" class="form-label">归口管理部门</label>
        <select id="centralizedManagementDepartment" name="centralizedManagementDepartment" class="form-select" required>
          <!-- <option value="" disabled selected>请选择归口管理部门</option> -->
          <option value="资产管理部">资产管理部</option>
          <option value="信息中心">信息中心</option>
          <option value="后勤保障部">后勤保障部</option>
          <option value="党委宣传部">党委宣传部</option>
          <option value="院务部">院务部</option>
          <option value="肿瘤防治办公室">肿瘤防治办公室</option>
          <option value="医学教育部">医学教育部</option>
          <option value="工会">工会</option>
          <option value="安全保卫部">安全保卫部</option>
          <option value="护理部">护理部</option>
          <option value="医务部">医务部</option>
          <option value="离退休办公室">离退休办公室</option>
          <option value="科研部">科研部</option>
          <option value=""></option>
        </select>
      </div>
    </div>


    <div class="row g-3">
      <div class="col-sm-3">
        <label for="hospital" class="form-label">申购院区</label>
        <select id="hospital" name="hospital" class="form-select" required>
          <option value="" disabled selected>请选择院区</option>
          <option value="昆州院区">昆州院区</option>
          <option value="自贸院区">自贸院区</option>
          <option value="昆州与自贸院区">昆州与自贸院区</option>
        </select>
      </div>
    </div>



    <!-- 动态表格 -->
    <div class="mt-3">
      <label class="form-label d-block">限高信息</label>
        <table class="table table-bordered align-middle" id="itemsTable">
          <thead class="table-light text-center">
            <tr>
              <th style="width:10%">科室</th>
              <th style="width:16%">项目名称</th>
              <th style="width:8%">单价(万元)</th>
              <th style="width:8%">数量(单位)</th>
              <th style="width:8%">单位</th>
              <th style="width:10%">总价(万元)</th>   <!-- 自动计算总价 -->
              <th style="width:14%">采购方式</th>
              <th style="width:14%">备注</th>
              <th style="width:2%"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      <button type="button" id="btnAdd" class="btn btn-sm btn-secondary">➕ 新增一行</button>
    </div>




    <div class="row g-3">
      <div class="col-sm-3">
        <label class="form-label">复核日期</label>
        <input name="date" type="date" class="form-control" required>
      </div>
    </div>



    <!-- 操作按钮 -->
    <div class="d-flex gap-3 mt-4">
      <button type="button" id="btnPreview"  class="btn btn-primary flex-grow-1">预览</button>
      <button type="button" id="btnDownload" class="btn btn-success flex-grow-1" disabled>下载 Word</button>
    </div>
  </form>

  <!-- ====== 2. 预览区域 ====== -->
  <div id="exportArea" class="d-none"></div>

  <!-- ====== 依赖库 ====== -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js-version-updated@0.4.0/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
    /* ===== 公共工具 ===== */
    // const stripNumber = v => (isNaN(v) || v === '' ? v : Number(v).toString());
    const numStr = v => {
      if (v === '' || v == null || isNaN(v)) return v;      // 保留非数字 / 空值
      // 用字符串算出“整数部分 + 小数部分（如有）”
      const s = String(v);
      if (!s.includes('.')) return s;                       // 整数直接返回
      return s.replace(/(\.\d*?[1-9])0+$|\.0+$/, '$1');     // 去掉尾部 0
    };
    const formatDate  = iso => {
      const [y,m,d] = iso.split('-');
      return `${y}年${Number(m)}月${Number(d)}日`;
    };

    /* ===== 动态增删行 ===== */
    const tbody = document.querySelector('#itemsTable tbody');
    document.getElementById('btnAdd').onclick = () => addRow();
    addRow();                                // 默认一行

    function addRow(data = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="form-control" required value="${data.info_source || ''}"></td>
        <td><input class="form-control" required value="${data.purchase_dept || ''}"></td>
        <td><input type="number" step="any" class="form-control price-input" required value="${data.purchase_price || ''}"></td>
        <td><input type="number" step="any" class="form-control quantity-input" required value="${data.quantity || ''}"></td>
        <td><input class="form-control" required value="${data.model || ''}"></td>
        <td><input class="form-control total-output" readonly></td>
        <td>
          <select class="form-select" required>
            <option value="院内评审">院内评审</option>
            <option value="公开招标">公开招标</option>
            <option value="邀请招标">邀请招标</option>
            <option value="竞争性谈判">竞争性谈判</option>
            <option value="单一来源">单一来源</option>
            <option value="询价">询价</option>
            <option value="其他方式">其他方式</option>
          </select>
        </td>
        <td><input class="form-control" value="${data.notes || ''}"></td>
        <td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger">✖</button></td>`;
      tr.querySelector('button').onclick = () => tr.remove();

      // 自动绑定计算逻辑 自动计算总价
      const priceInput = tr.querySelector('.price-input');
      const quantityInput = tr.querySelector('.quantity-input');
      const totalOutput = tr.querySelector('.total-output');
      function updateTotal() {
        const price = parseFloat(priceInput.value);
        const qty = parseFloat(quantityInput.value);
        totalOutput.value = (!isNaN(price) && !isNaN(qty)) ? numStr(price * qty) : '';
      }
      priceInput.addEventListener('input', updateTotal);
      quantityInput.addEventListener('input', updateTotal);
      updateTotal();

      tbody.appendChild(tr);
    }

    /* ===== 数据收集与校验 ===== */
    function collectData() {
      const form = document.getElementById('dataForm');
      const fd = new FormData(form);
      const obj = Object.fromEntries(fd);

      const requiredFields = {
        'centralizedManagementDepartment': '归口管理部门',
        'hospital': '申购院区',
        'date': '复核日期'
      };

      let hasMissing = false;
      for (const [key] of Object.entries(requiredFields)) {
        const input = form.querySelector(`[name="${key}"]`);
        const value = obj[key]?.trim();
        if (!value) {
          input.classList.add('is-invalid');
          hasMissing = true;
        } else {
          input.classList.remove('is-invalid');
        }
      }

      // if (hasMissing) return null;

      // 表格校验
      const items = [];
      let tableError = false;
      const rows = [...tbody.querySelectorAll('tr')];
      const requiredCols = [0, 1, 2, 3, 4, 6];

      rows.forEach((tr, rowIndex) => {
        const tds = tr.querySelectorAll('td');
        // const getVal = i => tds[i]?.querySelector('input')?.value.trim() || '';
        const getVal = i => {
          const el = tds[i]?.querySelector('input, select');
          return el?.value?.trim() || '';
        };

        const getEl  = i => tds[i]?.querySelector('input');

        const values = requiredCols.map(getVal);
        const inputs = requiredCols.map(getEl);
        const allEmpty = values.every(v => v === '');
        const someEmpty = values.some(v => v === '');

        // 清除旧样式
        inputs.forEach(el => el?.classList.remove('is-invalid'));

        // 处理错误情况
        if (someEmpty && !allEmpty) {
          inputs.forEach((el, i) => {
            if (!values[i]) el.classList.add('is-invalid');
          });
          tableError = true;
          return;
        }

        if (allEmpty) {
          // 如果所有行中只有这一行，且它是空的 => 必须填，否则不能提交
          if (rows.length === 1) {
            inputs.forEach(el => el?.classList.add('is-invalid'));
            tableError = true;
          }
          return; // 忽略空行
        }

        // 有效行
        items.push({
          info_source: getVal(0),
          purchase_dept: getVal(1),
          purchase_price: getVal(2),
          quantity: getVal(3),
          model: getVal(4),
          total: getVal(5),  // 总价（只读）自动计算总价
          purchase_method: getVal(6),
          notes: getVal(7),
        });
      });

      // if (tableError || items.length === 0) return null;
      if (hasMissing || tableError || items.length === 0) return null;

      const totalRaw = Number(obj.unit_price) * Number(obj.quantity || 0);
      obj.total_price     = numStr(totalRaw);
      obj.items           = items;
      obj.unit_price_show = numStr(obj.unit_price);
      obj.date_show       = formatDate(obj.date);

      return obj;
    }


    /* ===== 构造导出 HTML ===== */
    function buildHTML(d) {
      const hasNotes = d.items.some(r => r.notes && r.notes.trim() !== '');

      const headerCells = `
        <th>科室</th>
        <th>项目名称</th>
        <th>限高单价（万元）</th>
        <th>数量（单位）</th>
        <th>单位</th>
        <th>总价（万元）</th> 
        <th>采购方式</th> 
        ${hasNotes ? '<th>备注</th>' : ''}
      `;

      const rows = d.items.map(r => `
        <tr>
          <td>${r.info_source}</td>
          <td>${r.purchase_dept}</td>
          <td>${numStr(r.purchase_price)}</td>
          <td>${numStr(r.quantity)}</td>
          <td>${r.model}</td>
          <td>${numStr(r.total)}</td>
          <td>${r.purchase_method}</td>
          ${hasNotes ? `<td>${r.notes || ''}</td>` : ''}
        </tr>
      `).join('');

      // return `
      //   <h2 style="text-align:center;">关于招采${d.hospital}${d.hospital}${d.科室1}${d.项目名称1}，${d.科室2}${d.项目名称3}，${d.科室2}${d.项目名称3}{以此类推增加}的请示</h2>

      //   <p>招标采购办公室收到${d.centralizedManagementDepartment}转办的${d.hospital}${d.科室1}${d.项目名称1}，${d.科室2}${d.项目名称3}，${d.科室2}${d.项目名称3}{以此类推增加}的采购需求书（详见附件1），该项目已通过资产管理委员会论证，已报入年度预算。</p>
      //   <p>${d.centralizedManagementDepartment}分别与${d.科室1}、${d.科室2}、${以此类推增加}及${d.科室_最后一个}完成了需求调查及价格调研工作，招标采购办公室于${d.date_show}对资产管理部所提交材料及最高限价（详见附件2）开展详细复核。经集体研判，该项目已达到招标采购的条件，建议${d.项目名称1}以最高限价${d.限高单价万元}/${d.单位}，${d.数量}${d.单位}，共计：${d.总价}万元进行采购。建议${d.项目名称1}以最高限价${d.限高单价万元}/${d.单位}，${d.数量}${d.单位}，共计：${d.总价}万元进行采购。建议${d.项目名称1}以最高限价${d.限高单价万元}/${d.单位}，${d.数量}${d.单位}，共计：${d.总价}进行采购。</p>
      //   <p>本次采购共计${d.数量的加和}台，总预算${总价的加和}万元。建议通过院内评审方式分别进行采购，从2025年医学装备类年度预算中支出。</p>
      //   <p>妥否，提请领导审议！</p>
        
      //   <table class="word-table">
      //     <thead><tr>${headerCells}</tr></thead>
      //     <tbody>${rows}</tbody>
      //   </table>

      // `;

      const projectList = d.items.map(r => `${r.info_source}${r.purchase_dept}`).join('、');

      const uniqueDepts = [...new Set(d.items.map(r => r.info_source))];
      const deptList = uniqueDepts.length > 1
        ? uniqueDepts.slice(0, -1).join('、') + '及' + uniqueDepts.at(-1)
        : uniqueDepts[0];

      const suggestionList = d.items.map(r => {
        return `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${r.purchase_dept}以最高限价人民币${numStr(r.purchase_price)} 万元/${r.model}，${r.quantity}${r.model}，共计：${(r.total)}万元，通过${r.purchase_method}方式进行采购。`;
      }).join('<br>');

      const totalQuantity = d.items.reduce((sum, r) => sum + Number(r.quantity || 0), 0); // 总台数
      const totalBudget   = d.items.reduce((sum, r) => sum + Number(r.total || 0), 0); // 总价之和，总预算

      return `
        <h2 style="text-align:center;">关于招采${d.hospital}${projectList}的请示</h2>

        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;招标采购办公室收到${d.centralizedManagementDepartment}转办的${d.hospital}${projectList}采购需求书（详见附件1），该项目已通过资产管理委员会论证，已报入年度预算。</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${d.centralizedManagementDepartment}分别与${deptList}完成了需求调查及价格调研工作，招标采购办公室于${d.date_show}对${d.centralizedManagementDepartment}所提交材料及最高限价（详见附件2）开展详细复核。经集体研判，该项目已达到招标采购的条件。建议采购限价及采购方式如下：</p>

        <p>${suggestionList}</p>

        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;本次采购项目共${d.items.length}项，总预算${numStr(totalBudget)}万元，从2025年医学装备类年度预算中支出。</p>
        <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;妥否，提请领导审议！</p>

      `;

    }
    // <table class="word-table">
    //   <thead><tr>${headerCells}</tr></thead>
    //   <tbody>${rows}</tbody>
    // </table>


    /* ===== 预览 ===== */
    let lastHtml = '';
    document.getElementById('btnPreview').onclick = () => {
      const data = collectData();
      if (!data) return;

      lastHtml = buildHTML(data);
      const exportArea = document.getElementById('exportArea');
      exportArea.innerHTML = lastHtml;
      exportArea.classList.remove('d-none');
      document.getElementById('btnDownload').disabled = false;
    };

    /* 表单改动 ⇒ 禁用下载 */
    document.getElementById('dataForm').addEventListener('input', () => {
      document.getElementById('btnDownload').disabled = true;
    });

    /* ===== 下载 Word ===== */
    document.getElementById('btnDownload').onclick = () => {
      if (!lastHtml) return;
      const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${
        document.querySelector('style').innerHTML
      }</style></head><body>${lastHtml}</body></html>`;

      const blob = window.htmlDocx.asBlob(fullHtml);
      saveAs(blob, '限高价复核情况表.docx');
    };

    // 必填的填完后，自动清除标红框
    document.querySelectorAll('#dataForm input, #dataForm select').forEach(el => {
      el.addEventListener('input', () => el.classList.remove('is-invalid'));
    });
    tbody.addEventListener('input', e => {
      if (e.target.tagName === 'INPUT') {
        e.target.classList.remove('is-invalid');
      }
    });

  </script>
</body>
</html>
